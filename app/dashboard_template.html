<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACREWS Credit Monitor</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s-bihar: #2a78d6; --s-maha: #eb6834; --s-india: #1baf7a;
  --wet: #2a78d6; --dry: #e34948; --mid: #f0efec;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --accent-wash: rgba(42,120,214,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s-bihar: #3987e5; --s-maha: #d95926; --s-india: #199e70;
    --wet: #3987e5; --dry: #e66767; --mid: #383835; --accent-wash: rgba(57,135,229,0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s-bihar: #3987e5; --s-maha: #d95926; --s-india: #199e70;
  --wet: #3987e5; --dry: #e66767; --mid: #383835; --accent-wash: rgba(57,135,229,0.14);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 0; max-width: 1120px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 2px; font-weight: 650; }
.sub { color: var(--ink-2); margin: 0; font-size: 14px; }
nav { display: flex; gap: 4px; overflow-x: auto; padding: 14px 16px 0; max-width: 1120px; margin: 0 auto;
  border-bottom: 1px solid var(--grid); }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2);
  padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
nav button:focus-visible, .tbl-toggle:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--s-bihar); outline-offset: 2px; }
main { max-width: 1120px; margin: 0 auto; padding: 16px; }
section[hidden] { display: none; }
h2 { font-size: 18px; margin: 8px 0 12px; font-weight: 650; }
h3 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card .note { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .k { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 26px; font-weight: 650; margin-top: 2px; }
.tile .d { color: var(--ink-2); font-size: 13px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.finding { border-left: 3px solid var(--ink); padding: 2px 0 2px 12px; margin: 0 0 12px; }
.finding p { margin: 4px 0 0; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin: 0 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); white-space: nowrap; z-index: 5; display: none; }
.tip b { font-weight: 600; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tbl-toggle { background: none; border: 1px solid var(--border); color: var(--ink-2); border-radius: 6px;
  font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer; margin-top: 8px; }
.tbl-wrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.status svg { flex: none; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 12px; font-size: 14px; }
select, input[type=range] { font: inherit; }
select { background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
.result { font-size: 17px; margin: 6px 0; }
.warn { border: 1px solid var(--warning); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--ink); margin-top: 8px; }
.pill { font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
details { margin-top: 8px; } summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
footer { max-width: 1120px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: 12px; }
.theme { float: right; background: none; border: 1px solid var(--border); color: var(--ink-2); border-radius: 6px; font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer; }
@media (max-width: 520px) { .tile .v { font-size: 22px; } h1 { font-size: 19px; } }
</style>
</head>
<body>
<header>
  <button class="theme" id="theme" type="button">Theme</button>
  <h1>Agricultural Credit Monitor — Bihar, Maharashtra, All-India</h1>
  <p class="sub">How formal bank credit to agriculture moves with monsoon, yield and crop-price shocks. Research prototype: associations, not causal proof.</p>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="main"></main>
<footer id="foot"></footer>
<div class="tip" id="tip" role="status"></div>

<script>
const D = /*__DATA__*/null;
const REG = D.regions;
const COLOR = { "Bihar": "var(--s-bihar)", "Maharashtra": "var(--s-maha)", "All-India": "var(--s-india)" };
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) {
    if (k === "html") el.innerHTML = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
const fmt = (v, d = 1) => v === null || v === undefined || Number.isNaN(v) ? "—" : (+v).toLocaleString("en-IN", { maximumFractionDigits: d, minimumFractionDigits: d });
const sign = (v, d = 1) => v === null || v === undefined ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v), d);
const crore = v => v === null ? "—" : "₹" + Math.round(v).toLocaleString("en-IN") + " cr";

// ---------------------------------------------------------------- tooltip
const tip = $("#tip");
function showTip(html, evt, host) {
  tip.innerHTML = html; tip.style.display = "block";
  const r = host.getBoundingClientRect(), tw = tip.offsetWidth;
  let x = evt.clientX - r.left + 14; if (x + tw > r.width) x = evt.clientX - r.left - tw - 14;
  tip.style.left = (r.left + window.scrollX + Math.max(0, x)) + "px";
  tip.style.top = (evt.clientY + window.scrollY - 10 - tip.offsetHeight) + "px";
}
const hideTip = () => tip.style.display = "none";

// ---------------------------------------------------------------- CSV export (FR-09)
function downloadCsv(table, name) {
  const q = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const csv = [...table.querySelectorAll("tr")].map(tr => [...tr.children].map(c => q(c.textContent.trim().replace(/−/g, "-"))).join(",")).join("\n");
  const a = h("a", { href: URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })), download: name });
  document.body.append(a); a.click(); a.remove();
}
// ---------------------------------------------------------------- table twin
function tableTwin(cols, rows) {
  const wrap = h("div", { class: "tbl-wrap", hidden: "" });
  const t = h("table", {}, h("thead", {}, h("tr", {}, cols.map(c => h("th", { class: c.num ? "num" : "" }, c.label)))),
    h("tbody", {}, rows.map(r => h("tr", {}, cols.map(c => h("td", { class: c.num ? "num" : "" }, c.f ? c.f(r) : (r[c.key] ?? "—")))))));
  wrap.append(t);
  const btn = h("button", { class: "tbl-toggle", type: "button", "aria-expanded": "false" }, "Show table");
  btn.onclick = () => { const open = wrap.hidden; wrap.hidden = !open; btn.textContent = open ? "Hide table" : "Show table"; btn.setAttribute("aria-expanded", open); };
  const dl = h("button", { class: "tbl-toggle", type: "button", style: "margin-left:6px" }, "Download CSV");
  dl.onclick = () => downloadCsv(t, "acrews_table.csv");
  return [h("div", {}, btn, dl), wrap];
}

// chart canvas = card content width, so 1 SVG unit = 1 CSS px and text keeps its size on every screen
const chartWidth = (inGrid = false) => {
  const main = ($("#main").clientWidth || 640) - 32;  // minus main padding
  const cols = inGrid ? Math.max(1, Math.min(3, Math.floor((main + 16) / (300 + 16)))) : 1;  // mirrors .grid minmax(300px)
  return Math.max(250, Math.min(1060, (main - 16 * (cols - 1)) / cols - 34));  // minus card padding + border
};
// ---------------------------------------------------------------- scales
const scale = (d0, d1, r0, r1) => v => r0 + (v - d0) / (d1 - d0 || 1) * (r1 - r0);
function niceTicks(lo, hi, n = 5) {
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0)), f = step0 / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

// ---------------------------------------------------------------- line chart (shared x, crosshair tooltip)
function lineChart(host, { series, unit, yFmt = v => fmt(v, 0), height = 240, marks = [], inGrid = false }) {
  const W = chartWidth(inGrid), H = height, m = { l: 44, r: 12, t: 10, b: 26 };
  const xs = [...new Set(series.flatMap(sr => sr.points.map(p => p[0])))].sort((a, b) => a - b);
  const ys = series.flatMap(sr => sr.points.map(p => p[1])).filter(v => v !== null);
  let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys); const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const X = scale(xs[0], xs[xs.length - 1], m.l, W - m.r), Y = scale(lo, hi, H - m.b, m.t);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": series.map(x => x.name).join(", ") + " — " + unit });
  const g = s("g", { class: "axis" }); svg.append(g);
  for (const t of niceTicks(lo, hi)) {
    g.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const tx = s("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }); tx.textContent = yFmt(t); g.append(tx);
  }
  const step = Math.ceil(xs.length / 8);
  xs.forEach((x, i) => { if (i % step === 0 || i === xs.length - 1) { const tx = s("text", { x: X(x), y: H - 8, "text-anchor": "middle" }); tx.textContent = x; g.append(tx); } });
  for (const mk of marks) { // shaded reference years (e.g. waiver years)
    svg.append(s("rect", { x: X(mk) - 6, y: m.t, width: 12, height: H - m.t - m.b, fill: "var(--accent-wash)" }));
  }
  for (const sr of series) {
    let d = "", pen = false;
    for (const [x, y] of sr.points) { if (y === null) { pen = false; continue; } d += (pen ? "L" : "M") + X(x).toFixed(1) + "," + Y(y).toFixed(1); pen = true; }
    svg.append(s("path", { d, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = [...sr.points].reverse().find(p => p[1] !== null);
    if (last) svg.append(s("circle", { cx: X(last[0]), cy: Y(last[1]), r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2 }));
  }
  const cross = s("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" }); svg.append(cross);
  const dots = series.map(sr => { const c = s("circle", { r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }); svg.append(c); return c; });
  const hit = s("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" }); svg.append(hit);
  const box = h("div", { class: "chart" }); box.append(svg);
  const move = evt => {
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const x = xs.reduce((a, b) => Math.abs(X(b) - p.x) < Math.abs(X(a) - p.x) ? b : a);
    cross.setAttribute("x1", X(x)); cross.setAttribute("x2", X(x)); cross.setAttribute("visibility", "visible");
    let html = `<b>${x}</b>`;
    series.forEach((sr, i) => {
      const v = sr.points.find(q => q[0] === x)?.[1] ?? null;
      dots[i].setAttribute("visibility", v === null ? "hidden" : "visible");
      if (v !== null) { dots[i].setAttribute("cx", X(x)); dots[i].setAttribute("cy", Y(v)); }
      html += `<div class="row"><span class="swatch" style="background:${sr.color}"></span>${sr.name}: <b>${v === null ? "—" : yFmt(v)}</b></div>`;
    });
    showTip(html + `<div style="color:var(--muted)">${unit}</div>`, evt, document.body);
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", () => { hideTip(); cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); });
  const legend = series.length > 1 ? h("div", { class: "legend" }, series.map(sr => h("span", {}, h("span", { class: "swatch", style: `background:${sr.color}` }), sr.name))) : null;
  const rows = xs.map(x => Object.fromEntries([["year", x], ...series.map(sr => [sr.name, sr.points.find(q => q[0] === x)?.[1] ?? null])]));
  host.append(...[legend, box, ...tableTwin([{ key: "year", label: "Year" }, ...series.map(sr => ({ label: sr.name + " (" + unit + ")", num: true, f: r => r[sr.name] === null ? "—" : yFmt(r[sr.name]) }))], rows)].filter(Boolean));
}

// ---------------------------------------------------------------- diverging bars (rainfall departure)
function departureBars(host, { points, threshold = -20, height = 200, name, inGrid = true }) {
  const W = chartWidth(inGrid), H = height, m = { l: 40, r: 10, t: 10, b: 26 };
  const ys = points.map(p => p[1]); const lo = Math.min(-45, ...ys) - 3, hi = Math.max(45, ...ys) + 3;
  const X = scale(points[0][0] - 0.5, points[points.length - 1][0] + 0.5, m.l, W - m.r), Y = scale(lo, hi, H - m.b, m.t);
  const bw = Math.max(2, (X(1) - X(0)) - 2);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${name}: monsoon rainfall departure from normal, per cent` });
  const g = s("g", { class: "axis" }); svg.append(g);
  for (const t of niceTicks(lo, hi, 4)) {
    g.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t === 0 ? "var(--axis)" : "var(--grid)" }));
    const tx = s("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }); tx.textContent = (t > 0 ? "+" : "") + t + "%"; g.append(tx);
  }
  svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(threshold), y2: Y(threshold), stroke: "var(--dry)", "stroke-width": 1, opacity: 0.6 }));
  const lab = s("text", { x: W - m.r, y: Y(threshold) + 12, "text-anchor": "end", fill: "var(--ink-2)", "font-size": 11 }); lab.textContent = "deficient (−20%)"; svg.append(lab);
  const step = Math.ceil(points.length / 9);
  points.forEach(([x, y], i) => {
    if (i % step === 0) { const tx = s("text", { x: X(x), y: H - 8, "text-anchor": "middle", class: "tick" }); tx.textContent = x; g.append(tx); }
    if (y === null) return;
    const y0 = Y(0), y1 = Y(y), top = Math.min(y0, y1), hgt = Math.max(1, Math.abs(y1 - y0));
    const r = s("rect", { x: X(x) - bw / 2, y: top, width: bw, height: hgt, rx: Math.min(2, bw / 2), fill: y < 0 ? "var(--dry)" : "var(--wet)" });
    const hitR = s("rect", { x: X(x) - Math.max(bw, 12) / 2, y: m.t, width: Math.max(bw, 12), height: H - m.t - m.b, fill: "transparent" });
    hitR.addEventListener("pointermove", e => { r.setAttribute("opacity", 0.75); showTip(`<b>${name} · monsoon ${x}</b><div>${sign(y, 0)}% vs 1971–2020 normal</div>`, e, document.body); });
    hitR.addEventListener("pointerleave", () => { r.removeAttribute("opacity"); hideTip(); });
    svg.append(r, hitR);
  });
  const box = h("div", { class: "chart" }); box.append(svg);
  const legend = h("div", { class: "legend" }, h("span", {}, h("span", { class: "swatch", style: "background:var(--dry)" }), "below normal"),
    h("span", {}, h("span", { class: "swatch", style: "background:var(--wet)" }), "above normal"));
  host.append(legend, box, ...tableTwin([{ key: "year", label: "Monsoon" }, { label: "Departure (%)", num: true, f: r => sign(r.v, 1) }], points.map(([year, v]) => ({ year, v }))));
}

// ---------------------------------------------------------------- coefficient plot
function coefPlot(host, { rows, unit, height }) {
  const W = chartWidth(), rowH = 30, m = { l: W < 520 ? 150 : 210, r: 16, t: 8, b: 30 }, H = height || m.t + m.b + rows.length * rowH;
  const vals = rows.flatMap(r => [r.lo, r.hi]); const lo = Math.min(0, ...vals) * 1.08, hi = Math.max(0, ...vals) * 1.08;
  const X = scale(lo, hi, m.l, W - m.r);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Estimated effects with 90% intervals, " + unit });
  const g = s("g", { class: "axis" }); svg.append(g);
  for (const t of niceTicks(lo, hi, 6)) {
    g.append(s("line", { x1: X(t), x2: X(t), y1: m.t, y2: H - m.b, stroke: t === 0 ? "var(--ink-2)" : "var(--grid)", "stroke-width": t === 0 ? 1.2 : 1 }));
    const tx = s("text", { x: X(t), y: H - 12, "text-anchor": "middle" }); tx.textContent = (t > 0 ? "+" : "") + t; g.append(tx);
  }
  rows.forEach((r, i) => {
    const y = m.t + rowH * i + rowH / 2;
    const lab = s("text", { x: m.l - 10, y: y + 4, "text-anchor": "end", fill: "var(--ink)", "font-size": 12 }); lab.textContent = r.label; svg.append(lab);
    svg.append(s("line", { x1: X(r.lo), x2: X(r.hi), y1: y, y2: y, stroke: r.color || "var(--ink-2)", "stroke-width": 2, "stroke-linecap": "round" }));
    const filled = r.cls === "countercyclical" || r.cls === "procyclical";
    const c = s("circle", { cx: X(r.est), cy: y, r: 5, fill: filled ? (r.color || "var(--ink)") : "var(--surface)", stroke: r.color || "var(--ink)", "stroke-width": 2 });
    const hitR = s("rect", { x: m.l, y: y - rowH / 2, width: W - m.l - m.r, height: rowH, fill: "transparent" });
    hitR.addEventListener("pointermove", e => showTip(`<b>${r.label}</b><div>Estimate ${sign(r.est)} (${unit})</div><div>90% interval ${sign(r.lo)} to ${sign(r.hi)}</div><div>wild-bootstrap p = ${fmt(r.p, 3)}${r.q !== null && r.q !== undefined ? ` · q = ${fmt(r.q, 3)}` : ""}</div><div>${r.cls || "control / not classified"}</div>`, e, document.body));
    hitR.addEventListener("pointerleave", hideTip);
    svg.append(c, hitR);
  });
  const box = h("div", { class: "chart" }); box.append(svg);
  host.append(h("div", { class: "legend" }, h("span", {}, "● filled = significant at 10% (wild bootstrap)"), h("span", {}, "○ hollow = inconclusive"), h("span", {}, "line = 90% interval")),
    box, ...tableTwin([{ key: "label", label: "Estimate" }, { label: "Effect", num: true, f: r => sign(r.est) }, { label: "90% low", num: true, f: r => sign(r.lo) },
      { label: "90% high", num: true, f: r => sign(r.hi) }, { label: "p (wild)", num: true, f: r => fmt(r.p, 3) }, { label: "q (BH)", num: true, f: r => fmt(r.q, 3) }, { key: "cls", label: "Reading" }], rows));
}

// ---------------------------------------------------------------- status chips (icon + label, never colour alone)
const STATUS = {

// path of credit vs a normal-monsoon baseline: one line + 90% band per series
function pathChart(host, { series, xLabels, unit, height = 220 }) {
  const W = chartWidth(), H = height, m = { l: 44, r: 16, t: 12, b: 28 };
  const vals = series.flatMap(sr => sr.points.flatMap(p => [p.lo, p.hi]));
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const X = scale(0, xLabels.length - 1, m.l + 10, W - m.r - 10), Y = scale(lo, hi, H - m.b, m.t);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Credit path versus a normal monsoon, " + unit });
  const g = s("g", { class: "axis" }); svg.append(g);
  for (const t of niceTicks(lo, hi, 4)) {
    g.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t === 0 ? "var(--ink-2)" : "var(--grid)", "stroke-width": t === 0 ? 1.2 : 1 }));
    const tx = s("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }); tx.textContent = (t > 0 ? "+" : "") + t; g.append(tx);
  }
  xLabels.forEach((l, i) => { const tx = s("text", { x: X(i), y: H - 8, "text-anchor": "middle" }); tx.textContent = l; g.append(tx); });
  const zl = s("text", { x: X(0) + 8, y: Y(0) - 7, "text-anchor": "start", fill: "var(--ink-2)", "font-size": 11 }); zl.textContent = "0 = normal monsoon"; svg.append(zl);
  for (const sr of series) {
    const top = sr.points.map((p, i) => `${X(i)},${Y(p.hi)}`), bot = sr.points.map((p, i) => `${X(i)},${Y(p.lo)}`).reverse();
    svg.append(s("polygon", { points: [...top, ...bot].join(" "), fill: sr.color, opacity: 0.14 }));
    svg.append(s("path", { d: sr.points.map((p, i) => `${i ? "L" : "M"}${X(i)},${Y(p.est)}`).join(""), fill: "none", stroke: sr.color, "stroke-width": 2.2 }));
    sr.points.forEach((p, i) => {
      const c = s("circle", { cx: X(i), cy: Y(p.est), r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2 });
      c.addEventListener("pointermove", e => showTip(`<b>${sr.name} · ${xLabels[i]}</b><div>${sign(p.est)} ${unit}</div><div>90% range ${sign(p.lo)} to ${sign(p.hi)}</div>`, e, document.body));
      c.addEventListener("pointerleave", hideTip); svg.append(c);
    });
  }
  const box = h("div", { class: "chart" }); box.append(svg);
  host.append(h("div", { class: "legend" }, series.map(sr => h("span", {}, h("span", { class: "swatch", style: `background:${sr.color}` }), sr.name)), h("span", {}, "band = 90% interval")), box);
}

// x'b and x'Vx for a scenario vector on the headline state model
function stateScenario(region, shocks) {
  const m = D.scenario[region];
  const xb = x => x.reduce((a, v, i) => a + v * m.b[i], 0);
  const xVx = x => Math.max(0, x.reduce((a, vi, i) => a + vi * x.reduce((b, vj, j) => b + vj * m.V[i][j], 0), 0));
  const xe = m.terms.map(t => t === "const" ? 0 : (shocks[t] ?? 0));   // effect vs normal conditions
  const xp = m.terms.map(t => t === "const" ? 1 : (shocks[t] ?? 0));   // prediction, no waiver year
  const est = xb(xe), se = Math.sqrt(xVx(xe)), g = xb(xp), sePred = Math.sqrt(xVx(xp) + m.sigma2), t90 = m.t90;
  const out = Object.entries(shocks).filter(([t, v]) => v && (v < m.range[t][0] || v > m.range[t][1])).map(([t]) => t);
  return { est, lo: est - t90 * se, hi: est + t90 * se, growth: g, glo: g - t90 * sePred, ghi: g + t90 * sePred,
           crore: est / 100 * m.credit_cr, outside: out, m };
}

function resultsPage(el) {
  // scenario 1: district panel, both states, path over three years
  const card = h("div", { class: "card" }, h("h3", {}, "What does a dry monsoon imply for credit? District estimates"),
    h("p", { class: "note" }, "Applies the district-panel estimates to a monsoon departure you choose. Changes are relative to districts of the same state with a normal monsoon; bands are 90% intervals. ₹ crore = the % change applied to the state's latest direct farm credit."));
  const rng = h("input", { type: "range", min: -60, max: 40, step: 5, value: -20, "aria-label": "Monsoon departure, per cent" });
  const lab = h("b", {}, "−20%"); const out = h("div");
  card.append(h("div", { class: "controls" }, h("label", {}, "Monsoon departure ", rng, " ", lab)), out);
  const STATES = ["Bihar", "Maharashtra"];
  const LAGS = { Bihar: [["D8", "rain_shortfall_pct"], ["D15", "rain_shortfall_lag2_pct"], ["D15", "rain_shortfall_lag3_pct"]],
                 Maharashtra: [["D9", "rain_shortfall_pct"], ["D11", "rain_shortfall_lag2_pct"], ["D11", "rain_shortfall_lag3_pct"]] };
  const WHEN = ["Next March", "2 years on", "3 years on"];
  const render = () => {
    const dep = +rng.value, sf = -dep; lab.textContent = sign(dep, 0) + "%";
    const res = Object.fromEntries(STATES.map(st => [st, LAGS[st].map(([sp, t]) => { const c = dc(sp, t), a = c.coef * sf, b1 = c.ci90_low * sf, b2 = c.ci90_high * sf;
      return { est: a, lo: Math.min(b1, b2), hi: Math.max(b1, b2), p: c.p_wild, cls: c.classification }; })]));
    const lv = D.district_levels;
    const outside = STATES.filter(st => sf < lv[st].shortfall_range[0] || sf > lv[st].shortfall_range[1]);
    const head = st => { const r = res[st][st === "Bihar" ? 2 : 0]; return `${st}: ${sign(r.est)}% ${st === "Bihar" ? "three years on" : "next March"} (${sign(r.lo)} to ${sign(r.hi)})`; };
    const pc = h("div");
    out.replaceChildren(h("div", { class: "result" }, `Monsoon ${sign(dep, 0)}% → ${head("Bihar")}; ${head("Maharashtra")}.`), pc,
      h("div", { class: "tbl-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "When"), STATES.flatMap(st => [h("th", { class: "num" }, `${st} %`), h("th", { class: "num" }, "90% range"), h("th", { class: "num" }, "₹ crore")]))),
        h("tbody", {}, WHEN.map((w, i) => h("tr", {}, h("td", {}, w), STATES.flatMap(st => { const r = res[st][i];
          return [h("td", { class: "num" }, sign(r.est) + (r.cls === "inconclusive" ? "" : " *")), h("td", { class: "num" }, `${sign(r.lo)} to ${sign(r.hi)}`), h("td", { class: "num" }, sign(r.est / 100 * lv[st].direct_cr, 0))]; })))))),
      outside.length ? h("div", { class: "warn" }, `Outside the district departures observed in ${outside.join(" and ")} since 2009 — treat as extrapolation.`) : "",
      h("p", { class: "note", style: "margin-top:8px" }, `* significant at 10% (wild bootstrap). Bihar lags use district trends (D15); Maharashtra lags use D11. ₹ crore on direct credit of March ${lv.Bihar.year}: Bihar ${crore(lv.Bihar.direct_cr)}, Maharashtra ${crore(lv.Maharashtra.direct_cr)}.`));
    pathChart(pc, { unit: "% credit vs normal monsoon", xLabels: ["Monsoon", ...WHEN],
      series: STATES.map(st => ({ name: st, color: COLOR[st], points: [{ est: 0, lo: 0, hi: 0 }, ...res[st]] })) });
  };
  rng.oninput = render; render();

  // scenario 2: state time series (M4), all three regions, three shocks
  const card2 = h("div", { class: "card" }, h("h3", {}, "Compare regions: weather, yield and price shocks together"),
    h("p", { class: "note" }, "Headline state model (M4, ~20 years per region). Effect = change in next year's real credit growth versus normal conditions; the 90% interval reflects estimation uncertainty, the prediction interval adds the year-to-year noise in credit growth. No estimate here is robust — read as illustration."));
  const ctl = (label, min, max, val, unit) => { const i = h("input", { type: "range", min, max, step: 5, value: val, "aria-label": label }); const b = h("b", {}); return { i, b, el: h("label", {}, label + " ", i, " ", b), unit }; };

        h("tbody", {}, res.map(x => h("tr", {}, h("td", {}, x.r), h("td", { class: "num" }, sign(x.est)), h("td", { class: "num" }, `${sign(x.lo)} to ${sign(x.hi)}`),

  };
  [cR, cY, cP].forEach(c => c.i.oninput = render2); render2();

  // district coefficient plot
  const dcard = h("div", { class: "card" }, h("h3", {}, "District panel: effect of a 20-point monsoon shortfall on credit"),

  const pick = [["D1", "rain_shortfall_pct", "Both states · next March"], ["D2", "rain_shortfall_lag2_pct", "Both · 2 years on"], ["D2", "rain_shortfall_lag3_pct", "Both · 3 years on"],
    ["D14", "rain_shortfall_lag3_pct", "Both · 3 yrs on, trends"], ["D8", "rain_shortfall_pct", "Bihar · next March"], ["D15", "rain_shortfall_lag2_pct", "Bihar · 2 yrs on, trends"],
    ["D15", "rain_shortfall_lag3_pct", "Bihar · 3 yrs on, trends"], ["D9", "rain_shortfall_pct", "Maharashtra · next March"], ["D11", "rain_shortfall_lag3_pct", "Maharashtra · 3 years on"],
    ["DP", "rain_shortfall_lead_placebo_pct", "Placebo: later monsoon"]];
  coefPlot(dcard, { unit: "% credit per 20-pt shortfall", rows: pick.map(([sp, t, label]) => { const c = dc(sp, t);
    return { label, est: 20 * c.coef, lo: 20 * c.ci90_low, hi: 20 * c.ci90_high, p: c.p_wild, q: c.q_bh, cls: c.classification,
      color: label.startsWith("Bihar") ? COLOR.Bihar : label.startsWith("Maharashtra") ? COLOR.Maharashtra : null }; }) });

  // state summary
  const scard = h("div", { class: "card" }, h("h3", {}, "State time series: weather, production and price shocks (headline model M4)"),
    h("p", { class: "note" }, "Change in real credit growth (percentage points) after an illustrative adverse shock: 20-point monsoon shortfall, yield 10% below trend, 5% real crop-price fall. Newey-West errors; ~20 years per region."));
  coefPlot(scard, { unit: "pp real credit growth", rows: D.summary.map(r => ({ label: `${r.region} · ${r.shock.split(" (")[0]}`, est: r.effect_on_credit_growth_pp, lo: r.effect_ci90_low,
    hi: r.effect_ci90_high, p: r.p_wild, q: r.q_bh, cls: r.classification, color: COLOR[r.region] })) });
  const rob = h("details", {}, h("summary", {}, "Robustness: how often alternative specifications agree"),
    h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Region"), h("th", {}, "Shock"), h("th", { class: "num" }, "Specs"), h("th", { class: "num" }, "Same sign"), h("th", { class: "num" }, "Same sign & significant"))),
      h("tbody", {}, D.summary.map(r => h("tr", {}, h("td", {}, r.region), h("td", {}, r.shock), h("td", { class: "num" }, r.robustness_specs), h("td", { class: "num" }, r.robustness_same_sign), h("td", { class: "num" }, r.robustness_significant_same_sign))))));

  const kcard = h("div", { class: "card" }, h("h3", {}, "Bihar: what falls? Monsoon three years earlier"),
    h("p", { class: "note" }, "% change per 20-point shortfall in monsoon t−3. Fewer borrowers rather than smaller loans; concentrated in regional rural banks and rural branches. q = Benjamini–Hochberg across all 24 mechanism tests."));
  const K = [["K1", "Number of accounts"], ["K2", "Average loan size"], ["K3", "Sanctioned limit"], ["K4", "Public sector banks"], ["K5", "Private banks"],
    ["K6", "Regional rural banks"], ["K7", "Rural branches"], ["K8", "Semi-urban & urban branches"]];
  coefPlot(kcard, { unit: "% per 20-pt shortfall (t−3)", rows: K.map(([sp, label]) => rbRow(sp, "rain_shortfall_lag3_pct", label, COLOR.Bihar)) });
  const fcard = h("div", { class: "card" }, h("h3", {}, "Can these relationships forecast credit? Out-of-sample test"),
    h("p", { class: "note" }, "One-year-ahead forecasts of real credit growth, expanding window, 2016–2025. Ratio < 1 means better than the naive 'grows at its past average' forecast."),
    h("div", { class: "tbl-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["Region", "Model", "MAE (pp)", "Error vs naive", "Years better", "p vs naive"].map((t, i) => h("th", { class: i > 1 ? "num" : "" }, t)))),
      h("tbody", {}, D.fc_state.map(r => h("tr", {}, h("td", {}, r.region), h("td", {}, { naive_mean: "Naive: past average", naive_last: "Naive: last year", ar1: "Autoregressive", rain: "Monsoon t−1, t−2", full: "Monsoon + yield + price" }[r.model]),
        h("td", { class: "num" }, fmt(r.mae, 1)), h("td", { class: "num" }, fmt(r.mae_vs_naive_mean, 2)), h("td", { class: "num" }, `${r.wins_vs_naive_mean}/${r.n_forecasts}`), h("td", { class: "num" }, fmt(r.dm_p_vs_naive_mean, 2))))))),
    h("div", { class: "warn" }, `No model beats the naive forecast reliably. Ranking Bihar districts by their lagged shortfall gives a mean rank correlation of ${fmt(D.fc_district.reduce((a, r) => a + r.spearman_rank_corr, 0) / D.fc_district.length, 2)} with next year's credit growth — too weak to forecast with. The scenario tool above is descriptive, not a forecast.`));
  // design-plan validation extras (plan s.5.4, s.8)
  const tbl = (cols, rows) => h("div", { class: "tbl-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, cols.map(([l, , n]) => h("th", { class: n ? "num" : "" }, l)))),
    h("tbody", {}, rows.map(r => h("tr", {}, cols.map(([, f, n]) => h("td", { class: n ? "num" : "" }, f(r))))))));
  const ho = D.fc_holdout, mean = k => ho.reduce((a, r) => a + r[k], 0) / ho.length;
  const SHOCK_OF = { R9: "drought_flag_75lpa", R10: "drought_flag_70lpa", R11: "spi_drought_flag", R12: "rain_spi_shortfall", R13: "rain_shortfall_pct", R14: "rain_shortfall_pct" };
  const plan = D.state_coefs.filter(r => SHOCK_OF[r.spec] === r.term || (["R13", "R14"].includes(r.spec) && ["yield_shortfall_pct", "price_fall_pct"].includes(r.term)));
  const vcard = h("div", { class: "card" }, h("h3", {}, "More validation from the design plan"),
    h("p", { class: "note" }, `Leave-one-drought-out: each drought credit year is predicted from all other years. Mean absolute error over ${ho.length} held-out years: naive ${fmt(mean("abs_err_naive_mean"))} pp, monsoon model ${fmt(mean("abs_err_rain"))} pp, full model ${fmt(mean("abs_err_full"))} pp — no consistent gain.`),
    tbl([["Region", r => r.region], ["Held-out credit year", r => r.held_out_year], ["Monsoon", r => sign(r.monsoon_departure_pct, 0) + "%", 1], ["Actual growth", r => sign(r.actual), 1],
      ["Naive", r => sign(r.naive_mean), 1], ["Monsoon model", r => sign(r.rain), 1], ["Full model", r => sign(r.full), 1]], ho),
    h("p", { class: "note", style: "margin-top:12px" }, "Alternative drought definitions and controls (headline M4 otherwise unchanged). Specifications with fewer than 3 drought years are not estimated (see model_skipped.csv)."),
    tbl([["Spec", r => r.spec], ["Change", r => r.question], ["Region", r => r.region], ["Shock", r => r.term.replace(/_pct$/, "").replace(/_/g, " ")],
      ["Coef", r => sign(r.coef, 2), 1], ["90% interval", r => `${sign(r.ci90_low, 2)} to ${sign(r.ci90_high, 2)}`, 1], ["p (wild)", r => fmt(r.p_wild, 3), 1], ["Reading", r => r.classification]], plan),
    h("p", { class: "note", style: "margin-top:12px" }, "Unit-root tests on the model series (2006–2025). ADF: H0 unit root; KPSS: H0 stationary. KPSS p-values are capped at 0.10 by its lookup table. Low power at n = 20."),
    tbl([["Region", r => r.region], ["Series", r => r.label], ["ADF p", r => fmt(r.adf_p, 3), 1], ["KPSS p", r => (r.kpss_p >= 0.1 ? "≥ " : "") + fmt(r.kpss_p, 3), 1], ["Reading", r => r.verdict]], D.unit_root));
  el.append(h("h2", {}, "Econometric results"), card, card2, dcard, ecard, kcard, scard, fcard, vcard,
    h("div", { class: "card" }, h("h3", {}, "How to read these"), h("p", { class: "note" },
      "Positive = credit higher after worse conditions (countercyclical); negative = credit lower (procyclical). Estimates are conditional associations. The district design compares districts of the same state in the same year, so state policy, prices and inflation cancel out; rainfall differences between neighbouring districts are plausibly unrelated to bank behaviour, but the mechanism (less lending vs less demand vs restructuring) is not identified.")));
}

  wrap.append(h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Year"), REG.map(r => h("th", {}, r)))),
    h("tbody", {}, [...years].reverse().map(y => h("tr", {}, h("td", {}, y), REG.map(r => { const x = D.ew_state.find(q => q.region === r && q.year === y);
      return h("td", { title: x ? x.indicators + (x.missing_inputs ? " | missing: " + x.missing_inputs : "") : "" }, x ? status(x.category) : "—", x && x.indicators !== "none" ? h("div", { style: "color:var(--ink-2);font-size:12px" }, x.indicators) : ""); }))))));
  card.append(wrap);
  const bt = h("div", { class: "card" }, h("h3", {}, "Does the signal anticipate weak credit? Historical backtest"),

    h("table", {}, h("thead", {}, h("tr", {}, ["Level", "Horizon", "Signals", "Precision", "Base rate", "Hit rate", "False-alarm rate"].map((t, i) => h("th", { class: i > 1 ? "num" : "" }, t)))),
      h("tbody", {}, D.bt_state.map(r => h("tr", {}, h("td", {}, r.region), h("td", {}, "1 year"), h("td", { class: "num" }, r.signals), h("td", { class: "num" }, fmt(r.precision, 2)), h("td", { class: "num" }, fmt(r.base_rate, 2)), h("td", { class: "num" }, fmt(r.hit_rate, 2)), h("td", { class: "num" }, fmt(r.false_alarm_rate, 2)))),
        D.bt_district.map(r => h("tr", {}, h("td", {}, `Districts · ${r.state}`), h("td", {}, `${r.horizon_years} year${r.horizon_years > 1 ? "s" : ""}`), h("td", { class: "num" }, r.drought_signals), h("td", { class: "num" }, fmt(r.precision, 2)), h("td", { class: "num" }, fmt(r.base_rate, 2)), h("td", { class: "num" }, fmt(r.hit_rate, 2)), h("td", { class: "num" }, fmt(r.false_alarm_rate, 2)))))),
    h("div", { class: "warn" }, "Result: the signals do not reliably anticipate weaker credit growth. Use this page as a descriptive monitor that points to places worth checking, not as a forecast."));
  const dl = h("div", { class: "card" }, h("h3", {}, `District watch list — monsoon ${D.ew_district[0].assessed_monsoon}`),
    h("p", { class: "note" }, "Districts with a deficient monsoon, and Bihar districts with a deficient monsoon 1–2 years earlier (the lag found in the district panel)."));
  const f = h("select", { "aria-label": "Filter districts" }, ["All flagged", "All districts"].map(v => h("option", {}, v)));
  const body = h("div");
  const draw = () => { const rows = D.ew_district.filter(r => f.value === "All districts" || r.category !== "Normal monitoring");
    body.replaceChildren(h("div", { class: "tbl-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["State", "District", "Category", "Reason", "Monsoon dep.", "Direct credit (latest)"].map((t, i) => h("th", { class: i >= 4 ? "num" : "" }, t)))),
      h("tbody", {}, rows.map(r => h("tr", {}, h("td", {}, r.state), h("td", {}, r.district), h("td", {}, status(r.category)), h("td", {}, r.reason), h("td", { class: "num" }, sign(r.monsoon_departure_pct, 0) + "%"), h("td", { class: "num" }, crore(r.direct_credit_cr))))))),
      h("p", { class: "note", style: "margin-top:8px" }, `${rows.length} districts shown.`)); };
  f.onchange = draw; draw();
  dl.append(h("div", { class: "controls" }, f), body);
  el.append(h("h2", {}, "Early warning (monitoring aid)"), card, dl, bt,
    h("p", { class: "note", style: "color:var(--ink-2);font-size:13px" }, "Not for individual credit decisions, loan approval or fund allocation. A flag means: verify local credit demand, disbursement timing and eligibility on the ground."));

      "Credit year t = amount outstanding at end-March t. It is matched to the June–September monsoon of calendar year t−1, the agricultural year (t−1)–t and prices of financial year (t−1)–t, so every shock predates the credit it is compared with. Rainfall departure is measured against the 1971–2020 mean of IMD 0.25° gridded rainfall. Yield shortfall = % below a region-specific linear trend. Price fall = area-weighted fall in real WPI of the region's crops, with weights fixed at the 2004–07 crop mix.")),

// ---------------------------------------------------------------- shell
const tabs = $("#tabs"), main = $("#main");
const built = {};
function select(id) {
  for (const b of tabs.children) b.setAttribute("aria-selected", b.dataset.id === id);
  for (const sec of main.children) sec.hidden = sec.id !== id;
  if (!built[id]) { pages.find(p => p[0] === id)[2]($("#" + id)); built[id] = true; }
  try { localStorage.setItem("acrews-tab", id); } catch (e) {}
}
for (const [id, label] of pages) {
  tabs.append(h("button", { role: "tab", "data-id": id, type: "button", onclick: () => select(id) }, label));
  main.append(h("section", { id, role: "tabpanel", hidden: "" }));
}
tabs.addEventListener("keydown", e => { const ids = pages.map(p => p[0]); const cur = ids.indexOf([...tabs.children].find(b => b.getAttribute("aria-selected") === "true").dataset.id);
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const n = ids[(cur + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length]; select(n); tabs.querySelector(`[data-id="${n}"]`).focus(); } });
let start = "overview"; try { start = localStorage.getItem("acrews-tab") || start; } catch (e) {}
if (location.hash.length > 1) start = location.hash.slice(1);
select(pages.some(p => p[0] === start) ? start : "overview");
$("#theme").onclick = () => { const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; };
$("#foot").textContent = `Generated ${D.generated} from saved outputs · model run ${D.model_run} · ACREWS research prototype. Sources: RBI (DBIE BSR-1, Handbook of Statistics on Indian States), IMD gridded rainfall, Office of the Economic Adviser (WPI), DES (MSP).`;
