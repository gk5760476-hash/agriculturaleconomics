# Streamlit settings for streamlit_app/ (read from the repo root, where both Streamlit Community Cloud
# and the local run command start). Theme tokens match app/dashboard.html; the chart palette was
# validated against these surfaces.
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#2c2c2a"
textColor = "#f0efec"

[browser]
gatherUsageStats = false
