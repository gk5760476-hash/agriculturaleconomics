[project]
name = "acrews"
version = "0.1.0"
description = "Agricultural Credit Resilience and Early-Warning System (Bihar, Maharashtra, All-India)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: end-to-end pipeline run (~1 min)"]
